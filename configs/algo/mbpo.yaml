name: mbpo
n_envs: 64

# ── SAC hyperparams ───────────────────────────────────────────────────────────
learning_rate: 3e-4
batch_size: 256
tau: 0.005
gamma: 0.99
ent_coef: auto   # thermostat: holds policy at target_entropy and self-adjusts α.
                 # A fixed small value removes the entropy TARGET, so the policy
                 # collapses (entropy free-falls) and ep_rew destabilizes.
target_entropy: auto    # SAC-parity setting (=-dim(A)=-2, same as sac.yaml). With
                       # the RAW-storage + VecNormalize-at-sample architecture the
                       # reward is now adaptively normalized exactly like pure SAC,
                       # so auto should be stable (the earlier α-collapse→Q-runaway
                       # was driven by the ±640 reward artifact + fixed non-adaptive
                       # scaling, both now removed). If it destabilises with model
                       # data (real_ratio<1), fall back to 0.0 (keeps α alive).

# ── World model ───────────────────────────────────────────────────────────────
ensemble_size: 5
num_elites: 3                  # best held-out ensemble members used for rollouts
hidden_sizes: [1024, 1024, 1024]
model_lr: 3e-4
model_weight_decay: 0
identity_prior: true           # world-model identity prior: square weight matrices
                                # init to I and decay back toward I (non-square toward 0)
                                # via decoupled AdamW-style weight decay. Encodes a
                                # "next state ≈ current state" residual prior.
identity_weight_decay: 5e-4     # decay coefficient used when identity_prior=true
                                # (overrides model_weight_decay for the world model)
model_train_freq: 2000         # retrain world model every N env steps
rollout_freq: 250              # regenerate synthetic rollouts every N env steps
model_train_epochs: 50         # independent bootstrap minibatch per ensemble member
model_batch_size: 512
sig_min: 1e-3                  # min aleatoric std (reference sig_min clamp)
sig_max: 1e3                   # max aleatoric std (reference sig_max clamp)
sampling_type: TS1             # rollout sampling: mean | TS1 | TSInf | DS


# ── Buffers ───────────────────────────────────────────────────────────────────
real_buffer_size: 1_000_000
model_buffer_size: 200_000       # rolling window of recent synthetic rollouts; with the
                                 # settings below this retains about five model fits at
                                 # rollout length 1 and becomes fresher as length grows
real_ratio: 0.1                  # equal real/model policy batch while model quality settles
real_ratio_start: 1.0            # begin from trustworthy real data
real_ratio_end: 0.5              # introduce model data only after the model has coverage
real_ratio_schedule_steps: 100_000

# ── Rollout schedule ──────────────────────────────────────────────────────────
warmup_steps: 1000           # pure random collection before model training
                               # (multiple of n_envs=64; matches SAC learning_starts≈10k)
warmup_policy: random          # random | waypoint_pd (shield is applied to either)
warmup_waypoint_kp: 10.0
warmup_waypoint_kd: 4.0
warmup_waypoint_action_limit: 1.0
warmup_safety_threshold: null   # optional controller-specific threshold
rollout_batch_size: 5_000      # enough synthetic diversity for the high SAC update rate
min_rollout_length: 1
max_rollout_length: 1
rollout_schedule_steps: 1_000_000  # steps over which length grows min→max
rollout_unc_threshold: 0.5     # truncate an imagined branch once epistemic ensemble
                               # disagreement ‖σ_epistemic‖₂ exceeds this, so rollouts stay in
                               # the model's reliable region instead of compounding
                               # error off-distribution. Because this now measures
                               # epistemic-only uncertainty, retune it from logged
                               # model_unc rather than using older total-std values.
                               # null disables. Watch
                               # train/rollout_len_eff vs rollout_len to tune.

# ── Exploration ───────────────────────────────────────────────────────────────
optimism: 0.0                  # rollout reward += optimism * ‖σ_epistemic‖₂.
                               # Optimism in the face of model uncertainty;
                               # 0.0 disables. Tune against train/model_unc (the mean
                               # ‖σ‖₂) so the bonus is a sensible fraction of the reward.

# ── Policy update ─────────────────────────────────────────────────────────────
utd_ratio: 75                   # SAC gradient steps per env step (after warmup)
checkpoint_freq: 50_000         # save policy/dynamics/VecNormalize during long runs

# ── Safety shield (backup / recovery policy) ──────────────────────────────────
# "Ergodic rollout" shield. Off by default (backup_wandb_id: null). When a backup
# is loaded, at each step the learning policy's proposed action a_learned is judged
# by the backup's recoverability value: SAC backup → min(Q1,Q2)(s, a_learned);
# PPO backup → V(s). If it is < safety_threshold the recovery policy acts instead.
#   • World-model buffer stores the EXECUTED action → learns s'=f(s, a_exec)
#   • SAC's real and model views store the PROPOSED action with the executed
#     outcome: (s, a_learned, s'(s, a_exec), r(s, a_exec))
#     — action overwriting on the planning MDP.
# The backup's OWN VecNormalize is loaded and used to renormalize obs before the
# Q-query (the learner and backup share the same obs layout, different stats).
backup_wandb_id: null           # wandb run id of a trained recovery policy (null = shield off)
backup_wandb_project: cyberrunner
backup_policy_path: null        # local fallback (.zip) if no wandb id is given
backup_vecnorm_path: null       # local fallback (VecNormalize .pkl)
safety_threshold: 0.3           # recoverability below this ⇒ play the recovery policy
# Optional linear anneal of the threshold over the first N steps (strict early,
# relaxing later); set safety_threshold_start/_end (else both default to
# safety_threshold above, i.e. a constant threshold) and
# safety_threshold_schedule_steps (steps to anneal over).
# safety_threshold_start: 0.3
# safety_threshold_end: 0.3
# safety_threshold_schedule_steps: 1

# ── Robust (pessimistic) recovery-Q update ──────────────────────────────────────
# Prop. robust_bound: periodically re-fits the loaded SAC backup's critic
# toward the pessimistic lower bound
#     Q_{R_eps,t}^{pi_r}(s,a) = E_{pi_r,mu}[ sum_h  1{s_h in R_eps}
#                                 - min(2L·(rho_t(s_h,a_h) - m)_+, 1) ]
# rho_t is approximated by the world-model ensemble's epistemic disagreement
# (‖σ_epistemic‖₂, the same quantity used for rollout-uncertainty truncation
# above). The proposition's per-step contraction schedule δ_max(h) is collapsed
# to the single constant margin `robust_recovery_margin` (m) below, subtracted
# from rho_t identically at every step. Requires an SAC backup (backup_wandb_id
# above); no-op otherwise. See MBPOTrainer._robust_recovery_q_update.
robust_recovery_update: false        # off by default
robust_recovery_L: 1.0               # Lipschitz constant L in the 2L(rho_t - m)_+ penalty
robust_recovery_margin: 0.0          # constant margin m subtracted from rho_t each step
robust_recovery_update_freq: 2000    # re-fit the backup critic every N env steps
robust_recovery_gradient_steps: 50   # critic (+ actor, if enabled below) gradient steps per re-fit
robust_recovery_batch_size: 256
# By default the recovery policy π_r itself stays FROZEN — only its critic is
# re-fit above. Set robust_recovery_policy_update: true to also fine-tune π_r
# online: each of the robust_recovery_gradient_steps above additionally takes
# one standard SAC actor-improvement step (climbing the just-refit, pessimistic
# critic; includes π_r's own ent_coef='auto' update, if it has one) on the same
# batch — see MBPOTrainer._robust_recovery_policy_step. No-op unless
# robust_recovery_update above is also true (it needs that re-fit critic).
# The backup keeps whatever gets fine-tuned: MBPOTrainer.save() persists the
# (possibly updated) backup policy + its VecNormalize alongside the learner.
robust_recovery_policy_update: false   # off by default — π_r stays frozen
robust_recovery_policy_lr: null        # optional override (float) for the backup
                                        # actor optimizer's LR; null keeps the LR
                                        # baked into the loaded checkpoint
