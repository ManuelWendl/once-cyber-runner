# @package _global_
# Shielded MBPO — the "ergodic rollout" scheme. Model-based maze solving guarded
# by a trained recovery/backup policy. At each step the backup policy's Q-function
# judges the learning policy's proposed action a_learned: if the recoverability
# min(Q1,Q2)(s, a_learned) < safety_threshold the recovery policy acts instead.
#   • World-model buffer ← EXECUTED action (learns true dynamics s'=f(s, a_exec))
#   • SAC real/model MDP ← (s, a_learned, s'(s, a_exec), r(s, a_exec))
#     i.e. action overwriting: the critic learns the consequence of *proposing*
#     a_learned while the state/reward follow the executed (possibly backup) action.
# The backup's own VecNormalize is downloaded with it and used to renormalize obs
# before the Q-query.
# Run: python train.py +experiment=solve-maze-once

defaults:
  - override /algo: mbpo

total_timesteps: 500_000

env:
  reward_every_n_waypoints: 3
  hole_penalty: 5.0
  episode_length: 2000
  continuing_task: true
  virtual_episode_length: 2000
  randomize_init_pos: false
  random_init_start_probability: 1

algo:
  warmup_policy: waypoint_pd
  warmup_waypoint_kp: 5.0
  warmup_waypoint_kd: 0.5
  warmup_waypoint_action_limit: 0.2
  warmup_safety_threshold: 0.75  # matches safety_threshold — warmup is the LEAST reliable phase
  # ── Safety shield / recovery policy ─────────────────────────────────────────
  backup_wandb_id: u8rnq5nr #led23vhn #oe73q5n6        # trained recovery (backup-sac) policy on wandb
  backup_wandb_project: cyberrunner
  backup_policy_path: null         # local fallback (.zip) if backup_wandb_id is null
  backup_vecnorm_path: null        # local fallback (VecNormalize .pkl)
  # ── Tuning history (safety_threshold / L / margin / optimism) ──────────────
  # The safe/complete trade-off turned out to be a CLIFF, not a gradient, and
  # every axis tried so far shares one failure mode: push any of
  # threshold/L/optimism even slightly past the "reliably completes" baseline
  # and the run locks into a safe-but-permanently-stuck trajectory instead of
  # gradually getting safer.
  #   threshold=0.6,  L=1.5, m=0.35, opt=1.0 → completes (13.84), 403 holes
  #   threshold=0.75, L=3.0, m=0.15, opt=1.0 → completes reliably, 190+ holes
  #   threshold=0.77 (+0.02!)                → stuck at progress=3.84
  #   threshold=0.8, 0.85                    → stuck at progress=1.3-1.4
  #   threshold=0.75, L=4.5 (threshold held) → stuck at progress=2.02
  #     (shield_real hit ~20%; raising L alone has the same locking effect as
  #     raising threshold — NOT a decoupled axis)
  #   threshold=0.75, L=3.5, opt=2.5         → LOOKED promising via the
  #     monotonic path_progress_max (peaked 8.86) but path_progress_recent_max
  #     — the policy's ACTUAL current capability — showed it collapsed back to
  #     ~2.02 for ~270k/326k steps; ep_rew_mean's decline (114→27→11) confirmed
  #     a real regression. Track recent_max, not max, when judging a run.
  #   threshold=0.75, L=3.5, opt=1.0         → stuck at progress=8.77 (best
  #     stuck point yet), only 15 holes — closest to the boundary so far.
  #   Annealing the threshold (any duration, 40k-150k steps) also just landed
  #   in the same safe-but-stuck regime rather than avoiding it.
  # Current experiment: hold the fully-known-completing baseline
  # (threshold=0.75, L=3.0, margin=0.15) fixed and lower optimism instead —
  # optimism directly rewards seeking OUT high-uncertainty states, which is
  # plausibly where holes concentrate, so cutting it may reduce falls without
  # touching the shield's own cliff-sensitive knobs at all.
  safety_threshold: 0.75
  optimism: 0.5
  # Less negative than mbpo.yaml's default "auto" (=-dim(A)=-2): SAC's automatic
  # entropy tuning was collapsing ent_coef→~0 well before the policy had solved
  # the full maze, locking in early local optima (verified: progress repeatedly
  # plateaued in lockstep with ent_coef bottoming out). Keeping more residual
  # entropy let training break through those plateaus instead of freezing there.
  target_entropy: -1.0
  # ── Robust (pessimistic) recovery-Q update (Prop. robust_bound) ────────────
  # margin=0.35/L=1.5 (still comfortably above the ~0.05-0.08 steady-state
  # noise floor) made the shield nearly binary at threshold=0.6: it almost
  # never fired (403 holes got through) because Q rarely dipped that low at
  # all. Lowering the margin makes the penalty engage earlier/more often
  # (more of the Q distribution ends up in the 0.6-0.9 range a MIDDLE
  # threshold can actually discriminate on, instead of Q sitting near its
  # ceiling everywhere and only threshold extremes doing anything); raising L
  # makes the penalty ramp up more sharply once past the margin, so genuinely
  # uncertain (s,a) get punished harder without moving the margin itself.
  # Saturates (penalty=1) around rho≈m+1/(2L)≈0.32, i.e. below
  # rollout_unc_threshold=0.5's "don't trust the model" line rather than well
  # above it — the penalty is now near-fully engaged before the model is even
  # distrusted enough to truncate rollouts.
  robust_recovery_update: true
  robust_recovery_L: 3.0
  robust_recovery_margin: 0.15
