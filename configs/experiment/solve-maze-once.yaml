# @package _global_
# Shielded MBPO — the "ergodic rollout" scheme. Model-based maze solving guarded
# by a trained recovery/backup policy. At each step the backup policy's Q-function
# judges the learning policy's proposed action a_learned: if the recoverability
# min(Q1,Q2)(s, a_learned) < safety_threshold the recovery policy acts instead.
#   • World-model buffer ← (s, a_exec, s'(s, a_exec), r(s, a_exec)) — always the
#     real executed transition, learns true dynamics s'=f(s, a_exec).
#   • SAC real/model MDP ← the SAME (s, a_exec, s'(s, a_exec), r(s, a_exec)); no
#     action overwriting. Where a_learned got overridden, a separate
#     (s, a_learned, 0, terminal) transition is ALSO stored (policy-facing
#     buffer only) — an isolated signal that proposing a_learned there is
#     worth nothing, without corrupting the real transition's own bootstrap.
# The backup's own VecNormalize is downloaded with it and used to renormalize obs
# before the Q-query.
# Run: python train.py +experiment=solve-maze-once

defaults:
  - override /algo: mbpo

total_timesteps: 2_000_000

env:
  reward_every_n_waypoints: 3
  hole_penalty: 5.0
  episode_length: 2000
  continuing_task: true
  virtual_episode_length: 2000
  randomize_init_pos: false
  random_init_start_probability: 0.0

algo:
  warmup_policy: waypoint_pd
  warmup_waypoint_kp: 5.0
  warmup_waypoint_kd: 0.5
  warmup_waypoint_action_limit: 0.2
  warmup_safety_threshold: 0.87   # matches safety_threshold — warmup is the LEAST reliable phase
  # ── Safety shield / recovery policy ─────────────────────────────────────────
  # backup_wandb_id must be an SAC backup with the SAME obs_n_stack/layout as
  # this experiment's env (see shielded-mbpo-obs-invariant). p5dobopp is
  # p3d3af7d fine-tuned for 500k extra steps with training concentrated on the
  # hole cluster around path_progress 7.5-9.8 (the one spot every earlier
  # backup/config combo got stuck at) — see configs/experiment/backup-sac.yaml
  # for how to reproduce that fine-tune against a different base backup.
  backup_wandb_id: p5dobopp   # other trained backups: p3d3af7d, tv5u146e, frzdolkz, kwvfnc69, xi9mts9d
  backup_wandb_project: cyberrunner
  backup_policy_path: null         # local fallback (.zip) if backup_wandb_id is null
  backup_vecnorm_path: null        # local fallback (VecNormalize .pkl)
  # Constant threshold, no schedule, no falls-so-far-dependent ramp (removed
  # the earlier hole_budget mechanism — see hole-budget-safety-threshold
  # memory for why: it papered over risk with an adaptive number instead of
  # a real pessimism fix, and still burst under the n_envs=64 burst
  # mechanism). 0.87 (not the "maximally strict" 1.0 tried earlier) — matches
  # an old (2026-08-28), pre-robust-recovery-update run that genuinely
  # learned to traverse the maze (goals_total 291-613 in just 500k steps,
  # vs 9 in 2M at threshold=1.0). At threshold=1.0 the backup's Q has to
  # output the literal maximum to ever be trusted, which a continuous
  # estimator essentially never does — shield/real_trigger_rate sat at
  # 60-90%+, meaning the actor almost never got to execute its own actions
  # and never built real multi-step control skill (confirmed via a genuine
  # cold-start eval: stuck at path_progress≈1.0 the entire episode, every
  # time). That old run's trigger rate was 18-35% at threshold=0.87 — real
  # headroom for the shield to actually trust a decent action. Still a
  # plain constant, no schedule, no reactivity — same principle as before,
  # different (evidence-backed) number.
  safety_threshold: 0.87
  # optimism=0.5 (the algo default): rewards synthetic rollouts for visiting
  # high-uncertainty states. Re-enabled per the goal-condition run comparison
  # (rdjehlxf) which used 0.5 and reached the actual goal 6x with fewer holes
  # than the optimism=0.0 run — the earlier "counterproductive" reasoning
  # doesn't hold once the recovery-Q pessimism (below) is doing its job.
  optimism: 1.0
  target_entropy: -2.0
  robust_recovery_update: true
  # L brought back down 2.5→1.0 (margin left at 0.3): 2.5 pushed
  # shield/real_trigger_rate up to ~85-89% by the end of a run, and the main
  # SAC critic diverged under that much "action overwriting" mismatch
  # (critic_loss into the millions, q down past -3000) — good safety numbers
  # but a policy whose own value function wasn't converging, i.e. poor avg
  # reward despite a fine max-progress readout. 1.0 is the algo's original
  # default, less pessimistic than even the 2.0 that (d3dphzj1, rdjehlxf)
  # used successfully.
  robust_recovery_L: 1.0
  robust_recovery_margin: 0.35
  # Also fine-tune the backup's actor π_r online (it was frozen before — only
  # its critic was re-fit above). Deterministic step, no entropy bonus (see
  # mbpo.py _robust_recovery_policy_step) — watch shield/real_trigger_rate.
  robust_recovery_policy_update: true
  robust_recovery_policy_lr: null
  # real_ratio_end brought back up 0.2→0.5 (algo default anneals real_ratio
  # 1.0→0.5 already; 0.2 was an extra anneal added earlier reasoning "practice
  # the hard passage more cheaply in imagination" — but it also means 80% of
  # SAC's training data is synthetic, doubly compounding the action-overwriting
  # mismatch (model error AND shield mismatch stacked). The old successful run
  # used the algo's plain 0.5 default, unmodified.
  real_ratio_end: 0.5
  # max_rollout_length reverted 3→1 (2026-09-19): the growth schedule 1→3 was
  # root-caused as the actual driver of the "second, unrelated" critic
  # divergence documented below (compounding world-model error in longer
  # synthetic rollouts) — confirmed by direct ablation (run 3vv7jpiu):
  # max_rollout_length=1 completed the full 2M steps with q/critic_loss never
  # leaving single digits and safety/holes_total=5 (vs 180 with growth
  # enabled and optimism=0.0, or full divergence with growth enabled and
  # optimism=0.5). No observed downside to keeping it at 1 — see
  # hole-budget-safety-threshold memory.
  max_rollout_length: 1
  # ── Action-overwriting REMOVED (2026-09-21) ─────────────────────────────────
  # Previously: whenever the shield overrode a_learned, the SAC-facing buffer
  # stored (s, a_learned, r(a_exec), s'(a_exec)) — a_learned drifts as the
  # actor trains while r,s' stay anchored to the (more static) backup, so the
  # critic chases a target that barely depends on the action it's attached
  # to. This was root-caused as the main-critic divergence driver (confirmed
  # by a no-shield control ablation that never diverged at all) and patched
  # with robust_override_penalty (a fixed reward deduction on the overridden
  # transition). That patch is now superseded: both the world-model and
  # policy-facing buffers store the SAME real, Bellman-consistent transition
  # (s, a_exec, r(a_exec), s'(a_exec)); where the shield overrode a_learned, a
  # SEPARATE (s, a_learned, 0, terminal) transition is injected into the
  # policy-facing buffer only — an isolated, honest "proposing this here is
  # worth nothing" signal that doesn't touch the real transition's bootstrap.
  # See MBPOTrainer.learn() / MBPOTrainer._generate_rollouts.
  # utd_ratio (algo default 75) alone only delayed/dampened the OLD
  # divergence, never eliminated it, at any value tried (75, 20); combined
  # with the (now-removed) override penalty at 10 it stayed genuinely
  # bounded for the full 2M steps of run 10rpqob0. Kept at 10 here as a
  # still-reasonable, conservative choice — not re-validated against the new
  # transition scheme yet.
  utd_ratio: 10
