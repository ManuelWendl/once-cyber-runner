# @package _global_
# Shielded MBPO — the "ergodic rollout" scheme. Model-based maze solving guarded
# by a trained recovery/backup policy. At each step the backup policy's Q-function
# judges the learning policy's proposed action a_learned: if the recoverability
# min(Q1,Q2)(s, a_learned) < safety_threshold the recovery policy acts instead.
#   • World-model buffer ← EXECUTED action (learns true dynamics s'=f(s, a_exec))
#   • SAC real/model MDP ← (s, a_learned, s'(s, a_exec), r(s, a_exec))
#     i.e. action overwriting: the critic learns the consequence of *proposing*
#     a_learned while the state/reward follow the executed (possibly backup) action.
# The backup's own VecNormalize is downloaded with it and used to renormalize obs
# before the Q-query.
# Run: python train.py +experiment=solve-maze-once

defaults:
  - override /algo: mbpo

total_timesteps: 2_000_000

env:
  reward_every_n_waypoints: 3
  hole_penalty: 5.0
  episode_length: 2000
  continuing_task: true
  virtual_episode_length: 2000
  randomize_init_pos: false
  random_init_start_probability: 1

algo:
  warmup_policy: waypoint_pd
  warmup_waypoint_kp: 5.0
  warmup_waypoint_kd: 0.5
  warmup_waypoint_action_limit: 0.2
  warmup_safety_threshold: 0.6   # matches safety_threshold — warmup is the LEAST reliable phase
  # ── Safety shield / recovery policy ─────────────────────────────────────────
  backup_wandb_id: s164wa1q #led23vhn #oe73q5n6        # trained recovery (backup-sac) policy on wandb, p3d3af7d,tv5u146e,frzdolkz,kwvfnc69,xi9mts9d
  backup_wandb_project: cyberrunner
  backup_policy_path: null         # local fallback (.zip) if backup_wandb_id is null
  backup_vecnorm_path: null        # local fallback (VecNormalize .pkl)
  # th=0.75/L=3/m=0.15/opt=0/tgt_ent=-2 regressed to precent=1.01 with the new
  # margin=1.0 backup (this exact combo was also one of the weaker performers
  # in the sweep under the old backup). th=0.7/L=2/m=0.2/opt=0.5/tgt_ent=-2
  # (the config that reached full completion, 13.84, in the sweep) ALSO got
  # stuck early (~1.3) with the new backup — entropy fully collapsed to -2
  # by step 90k, well before making real progress. Since it's the exact same
  # config that worked before, this points at the new backup's Q-value
  # distribution having a different scale than the old one, so the SAME
  # numeric threshold isn't the same effective strictness. Lowered back to
  # the maximally-permissive value we know works (0.6, the very first
  # retuned value, before any threshold bisection) to re-establish a
  # working baseline against the new backup specifically.
  safety_threshold: 0.75
  optimism: 0.5
  target_entropy: -2.0
  robust_recovery_update: true
  robust_recovery_L: 1.0
  robust_recovery_margin: 0.1
  # Also fine-tune the backup's actor π_r online (it was frozen before —
  # only its critic was re-fit above). Uses the checkpoint's own actor LR
  # (robust_recovery_policy_lr: null); lower it here if fine-tuning proves
  # unstable. Untuned — watch shield/robust_recovery_actor_loss and
  # shield/real_trigger_rate after enabling.
  robust_recovery_policy_update: true
  robust_recovery_policy_lr: null
